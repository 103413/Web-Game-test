<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script src="https://aframe.io/releases/1.4.0/aframe.min.js"></script>
</head>
<body>
    <a-scene>
        <a-box
            position="-1 1 -3"
            color="red"
            onclick="this.setAttribute('color', 'blue')">
        </a-box>

        <a-sphere
            position="1 1 -3"
            color="green"
            onclick="this.setAttribute('color', 'yellow')">
        </a-sphere>

        <a-camera position="0 1.6 0">
            <a-cursor></a-cursor>
        </a-camera>
    </a-scene>
</body>
</html>
