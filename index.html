<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Strand</title>
    <script src="https://aframe.io/releases/1.4.0/aframe.min.js"></script>
</head>
<body>

<a-scene>

    <a-sky color="#87CEEB"></a-sky>

    <a-plane
        position="0 0 -5"
        rotation="-90 0 0"
        width="20"
        height="20"
        color="#F4D03F">
    </a-plane>

    <a-plane
        position="0 0.02 -9"
        rotation="-90 0 0"
        width="20"
        height="8"
        color="#3498DB">
    </a-plane>

    <a-sphere
        position="5 7 -8"
        radius="1.5"
        color="#FFD700">
    </a-sphere>

    <a-cylinder
        position="-5 2 -5"
        radius="0.25"
        height="4"
        color="#8B4513">
    </a-cylinder>

    <a-cone
        position="-5 4.5 -5"
        radius-bottom="2"
        radius-top="0"
        height="3"
        color="#228B22">
    </a-cone>

    <a-cylinder
        position="5 1 -4"
        radius="0.2"
        height="2"
        color="#8B4513">
    </a-cylinder>

    <a-box
        position="5 2.2 -4"
        width="2"
        height="0.2"
        depth="1"
        rotation="0 0 -15"
        color="#E74C3C">
    </a-box>

    <a-box
        position="5 1.5 -4"
        width="2"
        height="0.2"
        depth="1"
        rotation="0 0 15"
        color="#E74C3C">
    </a-box>

    <a-camera position="0 2 5">
        <a-cursor></a-cursor>
    </a-camera>

</a-scene>

</body>
</html>
